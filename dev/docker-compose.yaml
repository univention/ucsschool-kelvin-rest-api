# Docker Compose configuration for Kelvin REST API development
#
# Prerequisites:
#   1. Run `make fetch-vm-data TARGET=hostname` to populate _vm_config/
#   2. Run `make build-docker-image` to build the Docker image
#
# Usage:
#   docker compose up
#
# Access the API at: http://127.0.0.1:8911/ucsschool/kelvin/

name: kelvin-dev
services:
  postgres:
    image: postgres:15-bookworm # UCS 5.2 version
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ucsschool-kelvin-rest-api
      POSTGRES_PASSWORD: univention
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucsschool-kelvin-rest-api"]
      interval: 5s
      timeout: 3s
      retries: 10
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 4318:4318 # OTLP/HTTP receiver
      - 8889:8889 # Prometheus exporter (scrape target / curl /metrics)
  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - otel-collector
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 9090:9090
  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    ports:
      - 3000:3000
    environment:
      # Dev convenience: no login, everyone is admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
  connector:
    image: ucsschool-kelvin-connector:dev
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
      target: connector-prod
    volumes:
      # Secrets and certificates
      - ./_vm_config/provisioning/:/var/lib/univention-appcenter/apps/ucsschool-kelvin-rest-api/conf/provisioning/:ro
      - ./_vm_config/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ./_vm_config/postgresql-kelvin.secret:/etc/ucsschool/kelvin/postgresql-kelvin.secret:ro
    stdin_open: true
    tty: true
    depends_on:
      - otel-collector
    environment:
      LDAP_SERVER_TYPE: "${LDAP_SERVER_TYPE}"
      PROVISIONING_FQDN: "${LDAP_SERVER_NAME}"
      KELVIN_HEALTH_URL: "http://kelvin:8911/health"
      # OpenTelemetry metrics (dev exploration), exported to the shared collector.
      UCSSCHOOL_KELVIN_OTEL_METRICS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "kelvin-connector"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    env_file:
      - _vm_config/env
    extra_hosts:
      - "${LDAP_MASTER}:${TARGET}"
    develop:
      watch:
        - action: sync+restart
          path: ../ucsschool-objects
          target: /app/ucsschool-objects
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
        - action: sync+restart
          path: ../kelvin-connector
          target: /app/kelvin-connector
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
  kelvin:
    image: ucsschool-kelvin-rest-api:dev
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
      target: kelvin-prod
    stdin_open: true
    tty: true
    ports:
      - 8911:8911
    env_file:
      - _vm_config/env
    environment:
      # OpenTelemetry HTTP metrics (dev exploration). Set the enable flag to "false"
      # to confirm the off path. The exporter targets the otel-collector service,
      # which prints received metrics to its stdout.
      UCSSCHOOL_KELVIN_OTEL_METRICS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "kelvin-api"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    extra_hosts:
      - "${LDAP_MASTER}:${TARGET}"
    hostname: "${HOSTNAME}"
    volumes:
      # Secrets and certificates
      - ./_vm_config/machine.secret:/etc/machine.secret:ro
      - ./_vm_config/ldap.secret:/var/lib/univention-appcenter/apps/ucsschool-kelvin-rest-api/conf/cn_admin.secret:ro
      - ./_vm_config/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ./_vm_config/tokens.secret:/var/lib/univention-appcenter/apps/ucsschool-kelvin-rest-api/conf/tokens.secret:ro
      - ./_vm_config/postgresql-kelvin.secret:/etc/ucsschool/kelvin/postgresql-kelvin.secret:ro

      # Configuration files
      - ./_vm_config/base.conf:/etc/univention/base.conf
      - ./_vm_config/mapped_udm_properties.json:/etc/ucsschool/kelvin/mapped_udm_properties.json:ro
      - ./_vm_config/user_import.json:/var/lib/ucs-school-import/configs/user_import.json

      # Custom hooks
      - ../custom_hooks/add_school_admins_to_admin_group.py:/var/lib/ucs-school-import/kelvin-hooks/add_school_admins_to_admin_group.py
    develop:
      watch:
        # Kelvin API source code
        - action: sync+restart
          path: ../kelvin-api
          target: /kelvin/kelvin-api
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"

        # UCS School Library
        - action: sync+restart
          path: ../ucs-school-lib
          target: /kelvin/ucs-school-lib
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"

        # UCS School Import
        - action: sync+restart
          path: ../ucs-school-import
          target: /kelvin/ucs-school-import
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"

        - action: sync+restart
          path: ../ucsschool-objects
          target: /kelvin/ucsschool-objects
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"

        # Univention Directory Manager modules (slim)
        - action: sync+restart
          path: ../univention-directory-manager-modules-slim
          target: /kelvin/univention-directory-manager-modules-slim
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"

        # Univention lib (slim)
        - action: sync+restart
          path: ../univention-lib-slim
          target: /kelvin/univention-lib-slim
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"

        # alembic configuration and migration scripts
        - action: sync+restart
          path: ../alembic
          target: /kelvin/alembic
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"

        # VM configuration (secrets, certificates, config files)
        - action: restart
          path: ./_vm_config

        # Rebuild on dependency changes
        - action: rebuild
          path: ../pyproject.toml
        - action: rebuild
          path: ../uv.lock
        - action: rebuild
          path: ../docker/Dockerfile
