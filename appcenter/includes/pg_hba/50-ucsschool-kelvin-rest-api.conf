@!@
# UCR template body for the Kelvin PostgreSQL pg_hba.conf subfile.
#
# Allowed client addresses come from the UCR variable
#   ucsschool/kelvin/db/connection
# (space separated CIDRs), defaulting to everyone -- access is guarded by the
# database password. This mirrors the keycloak app's 50-keycloak template.
#
# "md5" is used for compatibility: for a SCRAM-stored password PostgreSQL (>=10)
# transparently performs SCRAM authentication even when "md5" is configured.
db = 'ucsschool-kelvin-rest-api'
connections = configRegistry.get('ucsschool/kelvin/db/connection', '0.0.0.0/0').split()
for cidr in connections:
    print('host    %s    %s    %s    md5' % (db, db, cidr))
@!@
