exclude: ^venv/|^ucs-school-import/usr/share/ucs-school-import/scripts/ucs-school-import|^univention-lib-slim/|^univention-directory-manager-modules-slim/|^kelvin-api/static/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^basedpyright-baseline.json
      - id: check-json
      - id: check-xml
        exclude: ^doc/changelog/changelog-ucsschool-4.4v5-de.xml
      - id: check-yaml
        args: ["--unsafe"]
      - id: trailing-whitespace
  - repo: https://github.com/timothycrosley/isort
    rev: 7.0.0
    hooks:
      - id: isort
        entry: isort
  - repo: https://github.com/psf/black
    rev: 23.1.0
    hooks:
      - id: black
        entry: black --config .black
  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        files: ^ucsschool-objects
        args: [--strict]
        additional_dependencies:
          [
            "sqlalchemy",
            "pytest",
            "pytest-asyncio",
            "testcontainers",
            "pytestarch",
            "jsonpatch",
          ]
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-no-eval
      - id: rst-backticks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        entry: bandit -c .bandit
        language_version: python3.11
        additional_dependencies: ["pbr"]
        exclude: ^kelvin-api/tests/|^ucs-school-lib/modules/ucsschool/lib/tests/|^build_docs.py
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["--strict"]
  - repo: local
    hooks:
      - id: issue-reference
        stages: [commit-msg]
        name: issue-reference
        language: pygrep
        entry: '.*\n\n(Issue \w+(/[a-zA-Z_-]+)*#\d+|Bug #\d+)\n+(\n.*)*\Z'
        args: ["--multiline", "--negate"]
  - repo: https://git.knut.univention.de/univention/infrastructure/pre-commit-hooks/pre-commit-copyright
    rev: 0.2.1
    hooks:
      - id: reuse-toml-dry-run
      - id: reuse-toml
        stages: [ manual ]
      - id: update-copyright-year
        stages: [ manual ]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        alias: reuse-annotate
        name: "reuse annotate"
        args: ["annotate", "-c", "Univention GmbH", "-l", "AGPL-3.0-only", "--skip-unrecognised", "--skip-existing", "--template", "univention"]
        pass_filenames: true
        description: "Annotate all unlicensed files as AGPL-3.0-only with Univention GmbH copyright"
        stages: [manual]
        # we have to specify everything already covered by REUSE.toml again due to
        # https://github.com/fsfe/reuse-tool/issues/1190
        # MAKE SURE THIS IS IN SYNC WITH REUSE.toml
        # every path below is already licensed via one of:
        #  - the manual [[annotations]] block at the top of REUSE.toml
        #  - a dedicated block further down (doc images, spelling wordlists, vendored swagger-ui/redoc)
        #  - the auto-generated per-package override block (e.g. ucs-school-import/**)
        # some are also uncommentable formats (json/csv/svg/png) where reuse-annotate
        # would otherwise create stray *.license sidecar files instead of skipping
        exclude: "^basedpyright-baseline[.]json$\
                 |^openapi-client-udm-1[.]0[.]2[.]tar[.]gz$\
                 |^pyrightconfig[.]json$\
                 |^renovate[.]json$\
                 |^uv[.]lock$\
                 |^[.]python-version$\
                 |^univention-lib-slim/changelog$\
                 |^univention-directory-manager-modules-slim/changelog$\
                 |^doc/dev/requirements/requirements-nonfunctional_reference_envs[.]ods$\
                 |^doc/(dev|docs)/spelling_wordlist$\
                 |^doc/dev/_static/kelvin_rest_api_logo[.]svg$\
                 |^doc/docs/_static/kelvin_rest_api_logo[.]svg$\
                 |^doc/docs/components[.]png$\
                 |^kelvin-api/empty_configs/.*[.]json$\
                 |^kelvin-api/usr/share/ucs-school-import/configs/kelvin_defaults[.]json$\
                 |^kelvin-api/static/swagger-ui-.*\
                 |^kelvin-api/static/redoc[.]standalone-.*\
                 |^kelvin-connector/src/kelvin_connector/py[.]typed$\
                 |^ucsschool-objects/src/ucsschool_objects/core/py[.]typed$\
                 |^ucsschool-objects/src/ucsschool_objects/py[.]typed$\
                 |^ucsschool-objects/tests/py[.]typed$\
                 |^ucs-school-import/modules/ucsschool/importer/contrib/csv[.]py$\
                 |^ucs-school-import/usr/share/doc/.*\
                 |^ucs-school-import/examples/.*[.]csv$\
                 |^ucs-school-import/usr/share/ucs-school-import/configs/.*[.]json$\
                 |^ucs-school-import/usr/share/ucs-school-import/schema/.*[.]json$\
                 "
      - id: reuse
        alias: reuse-lint
        stages: [manual]
      - id: reuse-lint-file
  - repo: local
    hooks:
      - id: basedpyright-native-baseline
        name: basedpyright (relative to baseline, native)
        language: system
        entry: |
          sh -c 'uv sync && uv pip install basedpyright==1.39.8 && uv run basedpyright \
            --project pyrightconfig.json \
            --baselinefile basedpyright-baseline.json \
            --baselinemode=auto' --
        stages: [manual]
        pass_filenames: false
        types: [python]

  - repo: local
    hooks:
      - id: basedpyright-container-baseline
        name: basedpyright (relative to baseline)
        language: system
        entry: docker/pre_commit/run-basedpyright.sh baseline
        pass_filenames: false
        types: [python]

      - id: basedpyright-container-no-baseline
        name: basedpyright (lint file, no baseline)
        language: system
        entry: docker/pre_commit/run-basedpyright.sh no-baseline
        stages: [manual]
        pass_filenames: true
        types: [python]

      - id: basedpyright-container-write-baseline
        name: basedpyright (write baseline)
        language: system
        entry: docker/pre_commit/run-basedpyright.sh write-baseline
        stages: [manual]
        pass_filenames: false

default_language_version:
  python: python3.11
