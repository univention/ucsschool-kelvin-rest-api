variables:
  RUN_RENOVATE:
    value: "no"
    options:
      - "yes"
      - "no"
    description: "Set to yes if you want to run renovate"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_OPEN_MERGE_REQUESTS
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"
    # Without this a scheduled pipeline is dropped before any job is even
    # considered. The renovate schedule only works because it sets
    # RUN_RENOVATE, which the last rule matches.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "webide"
    - if: $CI_COMMIT_TAG
    - if: $RUN_RENOVATE == "yes"

include:
  - local: /.gitlab-ci/gitlab-ci.yml
    rules:
      - if: $RUN_RENOVATE != "yes"
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/renovate@2.12.0
    rules:
      - if: $RUN_RENOVATE == "yes"
