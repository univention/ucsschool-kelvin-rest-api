[project]
dynamic = ["version"]
name = "ucsschool-kelvin-rest-api"
license = "AGPL-3.0-only"
description = "UCS@school Kelvin REST API"
authors = [
    { name = "Univention GmbH", email = "ucsschool-maintainers@univention.de" }
]
requires-python = ">=3.11"
dependencies = [
    "aiocache>=0.12.3",
    "aiofiles>=24.1.0",
    "alembic>=1.18.4",
    "asgi-correlation-id>=4.3.4",
    "async-property>=0.2.2",
    "cachetools>=6.1.0",
    "diskcache>=5.6.3",
    "fastapi>=0.95.2,<0.98.0",
    "gunicorn>=23.0.0",
    "httpx<0.28.0",
    "kelvin-connector",
    "lazy-object-proxy>=1.11.0",
    "openapi-client-udm",
    "orjson>=3.11.0",
    "pip>=25.1.1",
    "psutil>=7.0.0",
    "psycopg[binary]>=3.3.3",
    "pyasn1>=0.6.1",
    "pyasn1-modules>=0.4.2",
    "pydantic[dotenv,email]<2",
    "pyjwt<2.10",
    "python-multipart>=0.0.20",
    "setuptools<81",
    "timing-asgi>=0.3.1",
    "ucs-school-import",
    "ucs-school-lib",
    "ucsschool-objects",
    "uldap3",
    "univention-configuration-registry",
    "univention-debhelper",
    "univention-directory-manager-modules",
    "uvicorn>=0.35.0",
]

[project.scripts]
ucr = "ucsschool.kelvin.cli:run_ucr"
univention-config-registry = "ucsschool.kelvin.cli:run_ucr"

[build-system]
requires = ["hatchling<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kelvin-api/ucsschool"]

[tool.hatch.version]
source = "code"
path = "kelvin-api/ucsschool/kelvin/__init__.py"
expression = "get_version()"

[tool.uv.workspace]
members = [
    "univention-lib-slim",
    "univention-directory-manager-modules-slim",
    "ucs-school-lib",
    "ucs-school-import",
    "ucsschool-objects",
    "kelvin-connector"
]

[tool.uv.sources]
uldap3 = { git = "https://git.knut.univention.de/univention/dev/libraries/uldap3.git" }
univention-directory-manager-modules = { workspace = true }
ucs-school-lib = { workspace = true }
ucs-school-import = { workspace = true }
ucsschool-objects = { workspace = true }
openapi-client-udm = { path = "openapi-client-udm-1.0.2.tar.gz" }
# Don't use git for the ucs repo, a checkout takes around 3 min
# https://github.com/astral-sh/uv/issues/1737
# Also don't use a branch, because the checksum of the download changes on new commits
univention-debhelper = { url = "https://git.knut.univention.de/univention/dev/ucs/-/archive/release-5.2-5/ucs-release-5.2-5.tar.gz?path=packaging/univention-debhelper", subdirectory = "packaging/univention-debhelper" }
univention-configuration-registry = { url = "https://git.knut.univention.de/univention/dev/ucs/-/archive/release-5.2-5/ucs-release-5.2-5.tar.gz?path=base/univention-config-registry", subdirectory = "base/univention-config-registry" }
kelvin-connector = { workspace = true }

[[tool.uv.index]]
url = "https://git.knut.univention.de/api/v4/projects/2254/packages/pypi/simple"

[dependency-groups]
dev = [
    "coverage>=5.3",
    "coverage~=6.5.0",
    "factory_boy>=3.1.0",
    "Faker~=15.0.0",
    "pytest~=9.0.2",
    "pytest-cov~=4.0.0",
    "pytest-asyncio~=1.3.0",
    "pytest-mock",
    "pyfakefs~=4.7.0",
    "tenacity>=9.1.2",
    "eralchemy[graphviz]>=1.6.0",
]

[tool.ruff]
line-length = 105
target-version = "py311"
extend-exclude = [
    "venv*",
    "univention-lib-slim",
    "univention-directory-manager-modules-slim",
    "kelvin-api/static",
    "ucs-school-import/usr/share/ucs-school-import/scripts/ucs-school-import",
    "doc/doc-common",
    "docker/build",
    "docker/ucs",
]

[tool.ruff.lint]
# E, W: pycodestyle; F: pyflakes; I: isort; S: flake8-bandit
# (replaces the standalone black, isort, flake8 and bandit tools).
select = ["E", "F", "W", "I", "S"]
# E203: whitespace before ':' (formatter-compatible)
# E231: missing whitespace after ',', ';', or ':' (formatter-compatible)
# E266: too many leading '#' for block comment (ucs-test metadata)
# S101: assert used (was bandit skip B101)
# S404: subprocess import (was bandit skip B404)
ignore = ["E203", "E231", "E266", "S101", "S404"]

[tool.ruff.lint.per-file-ignores]
# Test and tooling paths bandit excluded via its exclude_dirs / hook exclude.
"**/tests/**" = ["S"]
"ucs-test-ucsschool-kelvin/**" = ["S"]
"build_appcenter_changelog.py" = ["S"]
"build_docs.py" = ["S"]
".gitlab-ci/**" = ["S"]
"**/doc/**" = ["S"]
# Long doctest line: flake8 honoured the in-docstring "# noqa: E501",
# but ruff ignores noqa directives inside string literals.
"ucs-school-import/modules/ucsschool/importer/utils/username_handler.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ucsschool", "udm_rest_client", "univention"]
combine-as-imports = true

[tool.pytest.ini_options]
addopts = "--verbose --showlocals -p no:warnings --asyncio-mode=auto"

[tool.alembic]
script_location = "%(here)s/alembic"
