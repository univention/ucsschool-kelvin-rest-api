include:
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/pre-commit@2.12.0
    inputs:
      commit_msg_hooks: "conventional-pre-commit issue-reference"
      skip_hooks: "basedpyright-container-baseline"
      manual_stage_hooks: "basedpyright-native-baseline"
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/app-release@2.12.0
    inputs:
      app_id: "ucsschool-kelvin-rest-api"
      mail_sender: "ucsschool-maintainers@univention.de"
      author_alias: "The ByteBenders"
      changelog_link: "https://docs.software-univention.de/ucsschool-kelvin-rest-api/changelog.html"
      mail_recipient: "app-announcement@univention.de"
      chat_destination: "#product-announcements"
      ucs_base_version: "5.2"
      additional_update_appcenter_needs:
        - job: build_docker_image_kelvin
          optional: true
        - job: build_docker_image_connector
          optional: true
        - job: build_changelog_html
      appcenter_file_dir: "appcenter/"
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/ai-review@2.8.0"
    inputs:
      stage: tests
  # The two image builds. Version baked into the image: 0.0.0 on feature
  # branches, 999.0.0 on main, the release tag on tags. The "release-" tag
  # prefix is stripped by the version regex in ucsschool/kelvin/__init__.py.
  # On tags the image goes to the public registry, while the build cache stays
  # in the GitLab registry (cache_image).
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/buildkit@2.12.0"
    inputs:
      job_name: "build_docker_image_kelvin"
      stage: build
      dockerfile_path: "docker/Dockerfile"
      build_target: "kelvin-prod"
      image_name: "kelvin"
      image_tag_env_name: "IMAGE_TAG_KELVIN"
      registry_image: "$CI_REGISTRY_IMAGE/ucsschool-kelvin-rest-api"
      cache_image: "$CI_REGISTRY_IMAGE/ucsschool-kelvin-rest-api/cache"
      build_args: |
        app_id=$APP_ID
        commit=$CI_COMMIT_SHA
        date=$CI_JOB_STARTED_AT
        KELVIN_BUILD_VERSION=$KELVIN_BUILD_VERSION
      job_rules:
        - if: "$CI_COMMIT_TAG"
          variables:
            REGISTRY: "artifacts.software-univention.de"
            REGISTRY_IMAGE: "$REGISTRY/ucsschool/ucsschool-kelvin-rest-api"
            KELVIN_BUILD_VERSION: "$CI_COMMIT_TAG"
        - if: $CI_MERGE_REQUEST_ID
          variables:
            KELVIN_BUILD_VERSION: "0.0.0"
        - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
          variables:
            KELVIN_BUILD_VERSION: "999.0.0"
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/buildkit@2.12.0"
    inputs:
      job_name: "build_docker_image_connector"
      stage: build
      dockerfile_path: "docker/Dockerfile"
      build_target: "connector-prod"
      image_name: "connector"
      image_tag_env_name: "IMAGE_TAG_CONNECTOR"
      registry_image: "$CI_REGISTRY_IMAGE/ucsschool-kelvin-connector"
      cache_image: "$CI_REGISTRY_IMAGE/ucsschool-kelvin-connector/cache"
      build_args: |
        app_id=$APP_ID
        commit=$CI_COMMIT_SHA
        date=$CI_JOB_STARTED_AT
        KELVIN_BUILD_VERSION=$KELVIN_BUILD_VERSION
      job_rules:
        - if: "$CI_COMMIT_TAG"
          variables:
            REGISTRY: "artifacts.software-univention.de"
            REGISTRY_IMAGE: "$REGISTRY/ucsschool/ucsschool-kelvin-connector"
            KELVIN_BUILD_VERSION: "$CI_COMMIT_TAG"
        - if: $CI_MERGE_REQUEST_ID
          variables:
            KELVIN_BUILD_VERSION: "0.0.0"
        - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
          variables:
            KELVIN_BUILD_VERSION: "999.0.0"
  - project: "univention/dev/docs/sphinx-docker"
    file: "pipeline/sphinx.yml"
  - project: univention/dev/tooling/ci-components
    file:
      - fragments/misc.yaml
      - fragments/appcenter.yaml
      - fragments/openstack.yaml
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/sonarqube@2.12.0
    inputs:
      job_name: "build-sonar"
      stage: build

stages:
  - prepare
  - build
  - tests
  - merge
  - production
  - release
  - cleanup

variables:
  APP_BASE_VERSION: "999.0.0-staging"
  APP_UCS_VERSION: "5.2"
  DOCS_DIR: "doc/docs"
  DEV_DOCS_DIR: "doc/dev"
  APP_ID: "ucsschool-kelvin-rest-api"
  APP_NAME: "5.2/$APP_ID"
  PACKAGE: "ucs-test-ucsschool-kelvin"
  UCS_VERSION: "520"
  UCS_RELEASE: "5.2"
  SCOPE: "ucs-school-5.2"
  DOC_TARGET_NAME: $APP_ID
  DEB_IMAGE: docker-registry.knut.univention.de/phahn/ucs-debbase:$UCS_VERSION
  UCSLINT_IMAGE: gitregistry.knut.univention.de/univention/dev/ucs
  APPCENTER_CONTROL_IMAGE: "gitregistry.knut.univention.de/univention/dev/tooling/ci-components/univention-appcenter-control"
  UCS_SCHOOL_LIB_COVERAGE_LIMIT: 33
  KELVIN_COVERAGE_LIMIT: 37
  FORCE_APPCENTER:
    value: "false"
    options:
      - "true"
      - "false"
    description: "Force appcenter upload"

devdocs-html:
  extends: .sphinx-html-template
  variables:
    DOCS_DIR: $DEV_DOCS_DIR
  rules:
    - changes:
        - $DEV_DOCS_DIR/**/*

# NOTE mmdc not available in sphinx builder. Dispatch a fix in the following ticket
#      https://git.knut.univention.de/univention/dev/education/ucsschool-kelvin-rest-api/-/issues/197
#
# devdocs-pdf:
#   extends: .sphinx-pdf-template
#   variables:
#     DOCS_DIR: $DEV_DOCS_DIR
#     GIT_DEPTH: 100
#   rules:
#     - changes:
#         - $DEV_DOCS_DIR/**/*

devdocs-linkcheck:
  extends: .sphinx-linkcheck-template
  variables:
    DOCS_DIR: $DEV_DOCS_DIR
    GIT_DEPTH: 100
  rules:
    - changes:
        - $DEV_DOCS_DIR/**/*

devdocs-spelling:
  extends: .sphinx-spelling-template
  variables:
    DOCS_DIR: $DEV_DOCS_DIR
  rules:
    - changes:
        - $DEV_DOCS_DIR/**/*

docs-html:
  extends: .sphinx-html-template
  rules:
    - changes:
        - $DOCS_DIR/**/*
        - kelvin-api/changelog.rst

docs-pdf:
  extends: .sphinx-pdf-template
  variables:
    GIT_DEPTH: 100
  rules:
    - changes:
        - $DOCS_DIR/**/*
        - kelvin-api/changelog.rst

docs-linkcheck:
  extends: .sphinx-linkcheck-template
  variables:
    GIT_DEPTH: 100
  rules:
    - changes:
        - $DOCS_DIR/**/*
        - kelvin-api/changelog.rst

docs-spelling:
  extends: .sphinx-spelling-template
  rules:
    - changes:
        - $DOCS_DIR/**/*
        - kelvin-api/changelog.rst

docs-merge-to-one-artifact:
  extends: .sphinx-merge-template
  needs:
    - job: docs-html
    - job: docs-pdf
    - job: docs-spelling
      artifacts: false
    - job: docs-linkcheck
      artifacts: false
  rules:
    - changes:
        - $DOCS_DIR/**/*
        - kelvin-api/changelog.rst

docs-review:
  extends: .sphinx-review-template
  needs:
    - job: docs-merge-to-one-artifact
  rules:
    - changes:
        - $DOCS_DIR/**/*
        - kelvin-api/changelog.rst

# The template has inherit:variables:false to prevent the passing of pipeline
# variables to downstream, and therefore $DOCS_DIR is not available here.
docs-create-production-merge-request:
  extends: .sphinx-docs-merge-request-template
  needs:
    - job: docs-merge-to-one-artifact
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes:
        - doc/docs/**/*
        - kelvin-api/changelog.rst
    - if: "$CI_COMMIT_TAG"
      changes:
        - doc/docs/**/*
        - kelvin-api/changelog.rst

# Publish the user-facing documentation (including the changelog) to GitLab
# Pages. Reuses the HTML built by docs-html and serves it from the default
# branch. This is independent of docs-create-production-merge-request, which
# publishes to docs.software-univention.de.
pages:
  stage: production
  image: $SPHINX_BASE
  needs:
    - job: docs-html
      artifacts: true
  variables:
    BUILDDIR: "_build/$language"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - $DOCS_DIR/**/*
        - kelvin-api/changelog.rst
  script:
    - rm -rf public
    - mv "$DOCS_DIR/$BUILDDIR/html" public
  artifacts:
    paths:
      - public

build_changelog_html:
  stage: build
  image: gitregistry.knut.univention.de/univention/dev/docs/sphinx-docker/base@sha256:f4ae0cd320a7752163d5677e47d0bfbc44255cdc810c7b62ae854b7245294946
  script:
    - pip install lxml
    - ./build_docs.py
  artifacts:
    paths:
      - changelog.html

integration-tests:
  extends: .run_openstack_cfg
  stage: tests
  timeout: 240 minutes
  needs:
    - create_app_version
    - update_appcenter
  when: manual
  allow_failure: True
  variables:
    TARGET_VERSION: "5.2-6"
    OPENSTACK_CFG_FILE: ".gitlab-ci/branch_tests.cfg"
  script:
    - mkdir results
    - export APPVERSION_TO_INSTALL="$APP_VERSION"
    - !reference [.run_openstack_cfg, script]
    - .gitlab-ci/parse_junit.py
  artifacts:
    reports:
      junit: results/**/test-reports/**/*.xml


test ucs-school-lib:
  stage: tests
  rules:
    - changes:
        - ucs-school-lib/**/*
  needs:
    - job: build_docker_image_kelvin
  image:
    name: $IMAGE_TAG_KELVIN
    entrypoint: [""]
  script:
    - cp ucs-school-import/modules/ucsschool/lib/create_ou.py ucs-school-lib/modules/ucsschool/lib/
    - cd ucs-school-lib/modules
    - >
        pytest -lvv
        --asyncio-mode=auto
        --junitxml=${CI_PROJECT_DIR}/report.xml
        --cov=ucsschool.lib
        --cov-report term-missing
        --cov-fail-under="$UCS_SCHOOL_LIB_COVERAGE_LIMIT"
        --cov-report xml:${CI_PROJECT_DIR}/coverage.xml
        ucsschool/lib/tests
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test ucsschool-objects:
  stage: tests
  rules:
    - changes:
        - ucsschool-objects/**/*
  needs:
    - job: build_docker_image_kelvin
  image:
    name: $IMAGE_TAG_KELVIN
    entrypoint: [""]
  script:
    - cd ucsschool-objects
    - >
        pytest -lvv
        --junitxml=${CI_PROJECT_DIR}/report.xml
        --cov-fail-under=100
        --cov-report xml:${CI_PROJECT_DIR}/coverage.xml
        .
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test kelvin-connector:
  stage: tests
  rules:
    - changes:
        - kelvin-connector/**/*
  needs:
    - job: build_docker_image_connector
  image:
    name: $IMAGE_TAG_CONNECTOR
    entrypoint: [""]
  script:
    - cd kelvin-connector
    - >
        pytest -lvv
        --junitxml=${CI_PROJECT_DIR}/report.xml
        --cov-fail-under=100
        --cov-report xml:${CI_PROJECT_DIR}/coverage.xml
        .
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test kelvin-api:
  stage: tests
  rules:
    - changes:
        - kelvin-api/**/*
  needs:
    - job: build_docker_image_kelvin
  image:
    name: $IMAGE_TAG_KELVIN
    entrypoint: [ "" ]
  script:
    - cd ${CI_PROJECT_DIR}/kelvin-api
    - export LDAP_BASE="foo" LDAP_HOSTDN="" LDAP_SERVER_NAME="" LDAP_SERVER_PORT=0
    - >
        pytest -lvv
        --asyncio-mode=auto
        --junitxml=${CI_PROJECT_DIR}/report.xml
        --cov=ucsschool.kelvin
        --cov-report term-missing
        --cov-fail-under="$KELVIN_COVERAGE_LIMIT"
        --cov-report xml:${CI_PROJECT_DIR}/coverage.xml
        tests
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test_appcenter_scripts:
  stage: tests
  rules:
    - changes:
        - appcenter/tests/**/*
        - appcenter/preinst
  image:
    name: $UCSLINT_IMAGE
    entrypoint: [""]
  script:
    - |
      # Install bats and python to run tests
      # NOTE Issue univention/dev/education/ucsschool-kelvin-rest-api#180
      #      Think about to move bats into CI image
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get -qq update
      if ! apt-get -yqq install --no-install-recommends python3 bats; then
        apt-get -yqq install --no-install-recommends python3 bats
      fi
      # Keep the container lean
      rm -rf /var/lib/apt/lists/*
    - bats --version
    - |
      # Run tests and produce JUnit report for gitlab
      mkdir -p bats-report
      bats --report-formatter junit --output bats-report appcenter/tests/
      # NOTE Issue univention/dev/education/ucsschool-kelvin-rest-api#179)
      #      For some reason the report.xml is empty
  artifacts:
    when: always
    reports:
      junit: bats-report/report.xml

ucs_test_deb_lint:
  stage: build
  variables:
    GIT_DEPTH: 100
  rules:
    - changes:
        - ucs-test-ucsschool-kelvin/**/*
  image:
    name: $UCSLINT_IMAGE
    entrypoint: [""]
  script:
    - cd ucs-test-ucsschool-kelvin && ucslint -j ucslint.xml
  artifacts:
    reports:
      junit: ucs-test-ucsschool-kelvin/ucslint.xml

ucs_test_deb_build_git:
  stage: build
  image: $DEB_IMAGE
  variables:
    GIT_DEPTH: 100
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - ucs-test-ucsschool-kelvin/**/*
  script:
    - apt-get update
    - cd ucs-test-ucsschool-kelvin
    - apt-get -q --assume-yes build-dep .
    - dpkg-buildpackage -us -uc
    - install -d -m 755 build
    - mv ../*.tar.*z ../*.dsc ../*.deb ../*.buildinfo ../*.changes build/
  artifacts:
    paths:
      - ucs-test-ucsschool-kelvin/build/

ucs_test_deb_repo_import:
  stage: build
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ucs-test-ucsschool-kelvin/debian/changelog
  tags:
    - omar
  script:
    - >
        repo_admin.py
        -G $CI_REPOSITORY_URL
        -b $CI_COMMIT_BRANCH
        -P ucs-test-ucsschool-kelvin
        -r ${UCS_RELEASE}-0-0
        -s $SCOPE
        -p $PACKAGE

ucs_test_deb_repo_build:
  stage: build
  needs:
    - job: ucs_test_deb_repo_import
      artifacts: false
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ucs-test-ucsschool-kelvin/debian/changelog
  tags:
    - ladda
  script:
    - >
        build-package-ng
        --no-pbuilder-update
        -r ${UCS_RELEASE}-0-0
        -s $SCOPE
        -p $PACKAGE
