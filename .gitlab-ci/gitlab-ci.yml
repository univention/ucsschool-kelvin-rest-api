include:
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/pre-commit@2.12.0
    inputs:
      commit_msg_hooks: "conventional-pre-commit issue-reference"
      skip_hooks: "basedpyright-container-baseline"
      manual_stage_hooks: "basedpyright-native-baseline"
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/app-release@2.12.0
    inputs:
      app_id: "ucsschool-kelvin-rest-api"
      mail_sender: "ucsschool-maintainers@univention.de"
      author_alias: "The ByteBenders"
      changelog_link: "https://docs.software-univention.de/ucsschool-kelvin-rest-api/changelog.html"
      mail_recipient: "app-announcement@univention.de"
      chat_destination: "#product-announcements"
      ucs_base_version: "5.2"
      additional_update_appcenter_needs:
        - job: build_docker_image_kelvin
          optional: true
        - job: build_docker_image_connector
          optional: true
        - job: build_changelog_html
      appcenter_file_dir: "appcenter/"
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/ai-review@2.13.1"
    inputs:
      clear_previous_comments: true
      # Eleven jobs -- a prepare, six lenses, a consolidate, a post and two
      # validations -- so they get a stage of their own rather than sitting
      # among the test jobs.
      stage: review
  # Allure test report. The four pytest jobs all write into one
  # 'allure-results' at the project root, so one report covers every suite.
  #
  # All three jobs are gated on the same 'changes' list as those pytest jobs.
  # Without that, a documentation-only merge request would create a report job
  # with nothing to report on, and 'allure' exits non-zero when a results
  # pattern matches nothing. 'changes' matches everything in a scheduled
  # pipeline, which is what keeps the nightly complete.
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/allure@2.15.0
    inputs:
      report_stage: report
      publish_stage: publish
      # 'integration-results' holds the JUnit reports of 'integration-tests',
      # which Allure reads as well as its own format. It has to be the flat
      # directory 'parse_junit.py' collects them into, and not the 'results'
      # tree itself: Allure reads JUnit XML only from the files lying directly
      # in a directory it is given, never from a subdirectory, so the nested
      # 'results/<host>/test-reports/<section>/<test>.xml' ucs-test writes was
      # read as no results at all. Outside a schedule that job is manual, so
      # the directory is usually absent -- harmless, because allure only fails
      # when *none* of its patterns match anything.
      results_paths: "allure-results integration-results"
      # A nightly fills the history faster than the default 20 runs cover:
      # keep about two months of trend instead of three weeks.
      history_limit: "60"
      report_rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
          when: always
        - changes: &allure_test_paths
            - "ucs-school-lib/**/*"
            - "ucsschool-objects/**/*"
            - "kelvin-connector/**/*"
            - "kelvin-api/**/*"
          when: always
      # Only protected branches move the baseline, so a merge request is
      # measured against main and leaves it where it was.
      history_rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
          when: always
        - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
          changes: *allure_test_paths
          when: always
      # Publishes next to the Sphinx site the 'pages' job puts at the Pages
      # root: a deployment only replaces the ones with the same path prefix,
      # and these carry 'allure-<ref>'.
      pages_rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
          when: always
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes: *allure_test_paths
          when: always
        - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
          changes: *allure_test_paths
          when: always
  # The two image builds. Version baked into the image: 0.0.0 on feature
  # branches, 999.0.0 on main, the release tag on tags. The "release-" tag
  # prefix is stripped by the version regex in ucsschool/kelvin/__init__.py.
  # On tags the image goes to the public registry, while the build cache stays
  # in the GitLab registry (cache_image).
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/buildkit@2.12.0"
    inputs:
      job_name: "build_docker_image_kelvin"
      stage: build
      dockerfile_path: "docker/Dockerfile"
      build_target: "kelvin-prod"
      image_name: "kelvin"
      image_tag_env_name: "IMAGE_TAG_KELVIN"
      registry_image: "$CI_REGISTRY_IMAGE/ucsschool-kelvin-rest-api"
      cache_image: "$CI_REGISTRY_IMAGE/ucsschool-kelvin-rest-api/cache"
      build_args: |
        app_id=$APP_ID
        commit=$CI_COMMIT_SHA
        date=$CI_JOB_STARTED_AT
        KELVIN_BUILD_VERSION=$KELVIN_BUILD_VERSION
      job_rules:
        - if: "$CI_COMMIT_TAG"
          variables:
            REGISTRY: "artifacts.software-univention.de"
            REGISTRY_IMAGE: "$REGISTRY/ucsschool/ucsschool-kelvin-rest-api"
            KELVIN_BUILD_VERSION: "$CI_COMMIT_TAG"
        - if: $CI_MERGE_REQUEST_ID
          variables:
            KELVIN_BUILD_VERSION: "0.0.0"
        - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
          variables:
            KELVIN_BUILD_VERSION: "999.0.0"
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/buildkit@2.12.0"
    inputs:
      job_name: "build_docker_image_connector"
      stage: build
      dockerfile_path: "docker/Dockerfile"
      build_target: "connector-prod"
      image_name: "connector"
      image_tag_env_name: "IMAGE_TAG_CONNECTOR"
      registry_image: "$CI_REGISTRY_IMAGE/ucsschool-kelvin-connector"
      cache_image: "$CI_REGISTRY_IMAGE/ucsschool-kelvin-connector/cache"
      build_args: |
        app_id=$APP_ID
        commit=$CI_COMMIT_SHA
        date=$CI_JOB_STARTED_AT
        KELVIN_BUILD_VERSION=$KELVIN_BUILD_VERSION
      job_rules:
        - if: "$CI_COMMIT_TAG"
          variables:
            REGISTRY: "artifacts.software-univention.de"
            REGISTRY_IMAGE: "$REGISTRY/ucsschool/ucsschool-kelvin-connector"
            KELVIN_BUILD_VERSION: "$CI_COMMIT_TAG"
        - if: $CI_MERGE_REQUEST_ID
          variables:
            KELVIN_BUILD_VERSION: "0.0.0"
        - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
          variables:
            KELVIN_BUILD_VERSION: "999.0.0"
  # Everything that builds, checks or publishes the documentation, including
  # the sphinx templates it extends and the variables only it uses.
  #
  # Left out of scheduled pipelines entirely. 'rules: changes' matches
  # everything when there is no commit to diff against, so a nightly would
  # rebuild the documentation for nothing and, worse, republish it and record a
  # deployment of the production docs environment. One rule here does what a
  # guard in every job in that file did.
  - local: /.gitlab-ci/gitlab-ci-docs.yml
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"
  - project: univention/dev/tooling/ci-components
    file:
      - fragments/misc.yaml
      - fragments/appcenter.yaml
      - fragments/openstack.yaml
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/sonarqube@2.12.0
    inputs:
      job_name: "build-sonar"
      stage: build

stages:
  - prepare
  - build
  - tests
  - review
  - report
  - publish
  - merge
  - production
  - release
  - cleanup

variables:
  APP_BASE_VERSION: "999.0.0-staging"
  APP_UCS_VERSION: "5.2"
  APP_ID: "ucsschool-kelvin-rest-api"
  APP_NAME: "5.2/$APP_ID"
  PACKAGE: "ucs-test-ucsschool-kelvin"
  UCS_VERSION: "520"
  UCS_RELEASE: "5.2"
  SCOPE: "ucs-school-5.2"
  DEB_IMAGE: docker-registry.knut.univention.de/phahn/ucs-debbase:$UCS_VERSION
  UCSLINT_IMAGE: gitregistry.knut.univention.de/univention/dev/ucs
  APPCENTER_CONTROL_IMAGE: "gitregistry.knut.univention.de/univention/dev/tooling/ci-components/univention-appcenter-control"
  UCS_SCHOOL_LIB_COVERAGE_LIMIT: 33
  KELVIN_COVERAGE_LIMIT: 37
  FORCE_APPCENTER:
    value: "false"
    options:
      - "true"
      - "false"
    description: "Force appcenter upload"

build_changelog_html:
  stage: build
  image: gitregistry.knut.univention.de/univention/dev/docs/sphinx-docker/base@sha256:f4ae0cd320a7752163d5677e47d0bfbc44255cdc810c7b62ae854b7245294946
  script:
    - pip install lxml
    - ./build_docs.py
  artifacts:
    paths:
      - changelog.html

integration-tests:
  extends: .run_openstack_cfg
  stage: tests
  timeout: 240 minutes
  needs:
    - create_app_version
    - update_appcenter
  # Automatic in the nightly schedule, manual everywhere else. Three hours of
  # OpenStack per run is too much for every push to main -- 20 pipelines in the
  # last 30 days, five of them on a single day -- and an automatic job holds up
  # every later stage until it finishes, the release jobs included. One evenly
  # spaced run a night is also what the Allure trend wants, and its results
  # reach the report through plain stage ordering, with nothing to retry.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
  variables:
    TARGET_VERSION: "5.2-6"
    OPENSTACK_CFG_FILE: ".gitlab-ci/branch_tests.cfg"
  script:
    - mkdir results
    - export APPVERSION_TO_INSTALL="$APP_VERSION"
    - !reference [.run_openstack_cfg, script]
    - .gitlab-ci/parse_junit.py
  artifacts:
    # 'integration-results' is what 'allure:report' reads, 'results' keeps the
    # tree as ucs-test wrote it, logs included. Both are 'paths' as well as
    # 'reports', so that a retried 'allure:report' can read the results back
    # and fold them into the report. 'when: always' because a failed
    # integration run is the one worth looking at.
    when: always
    paths:
      - results
      - integration-results
    reports:
      junit: results/**/test-reports/**/*.xml


test ucs-school-lib:
  stage: tests
  rules:
    - changes:
        - ucs-school-lib/**/*
  needs:
    - job: build_docker_image_kelvin
  image:
    name: $IMAGE_TAG_KELVIN
    entrypoint: [""]
  script:
    - cp ucs-school-import/modules/ucsschool/lib/create_ou.py ucs-school-lib/modules/ucsschool/lib/
    - cd ucs-school-lib/modules
    - >
        pytest -lvv
        --asyncio-mode=auto
        --junitxml=${CI_PROJECT_DIR}/report.xml
        --alluredir=${CI_PROJECT_DIR}/allure-results
        --cov=ucsschool.lib
        --cov-report term-missing
        --cov-fail-under="$UCS_SCHOOL_LIB_COVERAGE_LIMIT"
        --cov-report xml:${CI_PROJECT_DIR}/coverage.xml
        ucsschool/lib/tests
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    # A failed run is the one the Allure report is wanted for, so the results
    # have to be uploaded then too.
    when: always
    paths:
      - allure-results
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test ucsschool-objects:
  stage: tests
  rules:
    - changes:
        - ucsschool-objects/**/*
  needs:
