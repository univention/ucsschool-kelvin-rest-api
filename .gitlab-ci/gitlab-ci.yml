test_appcenter_scripts:
  stage: tests
  rules:
    - changes:
        - appcenter/tests/**/*
        - appcenter/preinst
  image:
    name: $UCSLINT_IMAGE
    entrypoint: [""]
  script:
    - |
      # Install bats and python to run tests
      # NOTE Issue univention/dev/education/ucsschool-kelvin-rest-api#180
      #      Think about to move bats into CI image
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get -qq update
      if ! apt-get -yqq install --no-install-recommends python3 bats; then
        apt-get -yqq install --no-install-recommends python3 bats
      fi
      # Keep the container lean
      rm -rf /var/lib/apt/lists/*
    - bats --version
    - |
      # Run tests and produce JUnit report for gitlab
      mkdir -p bats-report
      bats --report-formatter junit --output bats-report appcenter/tests/
      # NOTE Issue univention/dev/education/ucsschool-kelvin-rest-api#179)
      #      For some reason the report.xml is empty
  artifacts:
    when: always
    reports:
      junit: bats-report/report.xml

ucs_test_deb_lint:
  stage: build
  variables:
    GIT_DEPTH: 100
  rules:
    # 'rules: changes' always matches in a scheduled pipeline, so this
    # would run every night with no change behind it.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
        - ucs-test-ucsschool-kelvin/**/*
  image:
    name: $UCSLINT_IMAGE
    entrypoint: [""]
  script:
    - cd ucs-test-ucsschool-kelvin && ucslint -j ucslint.xml
  artifacts:
    reports:
      junit: ucs-test-ucsschool-kelvin/ucslint.xml

ucs_test_deb_build_git:
  stage: build
  image: $DEB_IMAGE
  variables:
    GIT_DEPTH: 100
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - ucs-test-ucsschool-kelvin/**/*
  script:
    - apt-get update
    - cd ucs-test-ucsschool-kelvin
    - apt-get -q --assume-yes build-dep .
    - dpkg-buildpackage -us -uc
    - install -d -m 755 build
    - mv ../*.tar.*z ../*.dsc ../*.deb ../*.buildinfo ../*.changes build/
  artifacts:
    paths:
      - ucs-test-ucsschool-kelvin/build/

ucs_test_deb_repo_import:
  stage: build
  variables:
    GIT_STRATEGY: none
  rules:
    # 'rules: changes' always matches in a scheduled pipeline, and this has an
    # effect outside it: importing the package into the build repository.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ucs-test-ucsschool-kelvin/debian/changelog
  tags:
    - omar
  script:
    # '--force' so that importing a revision already in the repository is a
    # no-op rather than an error. Without it the job dies on
    # 'AlreadyImported', which is what happens whenever it runs without the
    # changelog having moved -- a manual pipeline, for instance, where
    # 'rules: changes' matches everything. This repository's own
    # 'debian-package' component has always passed it.
    - >
        repo_admin.py
        -G $CI_REPOSITORY_URL
        --force
        -b $CI_COMMIT_BRANCH
        -P ucs-test-ucsschool-kelvin
        -r ${UCS_RELEASE}-0-0
        -s $SCOPE
        -p $PACKAGE

ucs_test_deb_repo_build:
  stage: build
  needs:
    - job: ucs_test_deb_repo_import
      artifacts: false
  variables:
    GIT_STRATEGY: none
  rules:
    # 'rules: changes' always matches in a scheduled pipeline, and this has an
    # effect outside it: building the package on the build system.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ucs-test-ucsschool-kelvin/debian/changelog
  tags:
    - ladda
  script:
    - >
        build-package-ng
        --no-pbuilder-update
        -r ${UCS_RELEASE}-0-0
        -s $SCOPE
        -p $PACKAGE
