[project]
name = "kelvin-connector"
version = "0.1.0"
description = "Connector from Nubus to Kelvin"
readme = "README.md"
authors = [
    { name = "Univention GmbH", email = "ucsschool-maintainers@univention.de" }
]
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "provisioning-consumer-lib>=0.9.9",
    "pydantic>=2.12",
    "python-ldap>=3.4.4",
    "requests>=2.32.4",
    "sqlalchemy>=2.1",
    "ucsschool-objects",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
connector = "kelvin_connector.connector:main"

[tool.pytest.ini_options]
addopts = "--verbose --showlocals -p no:warnings  --cov=kelvin_connector --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/kelvin_connector"]
branch = true
omit = ["*/src/kelvin_connector/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]


[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "allure-pytest>=2.16.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0.0",
]
